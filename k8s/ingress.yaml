apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: food-delivery-ingress
  namespace: food-delivery
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: food-delivery-backend
            port:
              number: 4000

      - path: /images
        pathType: Prefix
        backend:
          service:
            name: food-delivery-backend
            port:
              number: 4000

      - path: /
        pathType: Prefix
        backend:
          service:
            name: food-delivery-frontend
            port:
              number: 80
